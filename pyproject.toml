[project]
name = "llm-simulator"
version = "0.1.0"
description = "A GPU-free, deterministic stand-in for an OpenAI-compatible LLM server. Its latency and throughput respond to load the way a real serving engine's do, so the systems built on top of a model can find their own bottlenecks and failure modes without paying for model inference."
authors = [{name="Umang Aggarwal", email="umangaggarwal2@github.com"}]
license = "MIT"
readme = "README.md"
keywords = ["llm", "openai", "performance", "gpu", "simulator", "testing", "mock", "deterministic"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.1,<3",
    "uvicorn[standard] (>=0.15.0)",
    "pyyaml>=5.4.1",
    "prometheus-client>=0.20,<1",
    # llmsim-bench's HTTP client
    "aiohttp>=3.9,<4",
]

[project.urls]
repository = "https://github.com/umangaggarwal2/llm-simulator"
homepage = "https://github.com/umangaggarwal2/llm-simulator"

[project.scripts]
llmsimulator = "llm_simulator.client.api:main"
llmsim-bench = "llm_simulator.bench.cli:main"

[tool.poetry]
packages = [
    { include = "llm_simulator", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0,<10"
black = ">=26.1,<27"
httpx2 = ">=2.14,<3"
openai = ">=3.0,<4"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: runs a real server and talks to it over HTTP (deselect with -m 'not integration')",
]