# Variants of qwen-mock-batched for validating the scheduler; see "Scheduler
# validation" in docs/architecture.md. Each variant differs from `base` in the
# fields it lists, so one server can compare them side by side:
#   LLM_SIM_MODELS=config/validation/models.yml \
#   LLM_SIM_RESPONSES=config/bench-responses.yml poetry run llmsimulator
# or, in Docker, SIM_CONFIG_DIR=../config/validation for bench-target.
version: 1

hardware:
  h100-80gb:
    hbm_gib: 80
    memory_bandwidth_gbps: 3000
    peak_tflops: 989

models:
  # The same as qwen-mock-batched in config/models.yml.
  - &base
    name: base
    context_length: 32768
    tokenizer: regex
    engine: scheduler
    hardware: h100-80gb
    weights: &weights
      parameters_billions: 6.74
      bytes_per_parameter: 2
    kv_cache: &kv_cache
      bytes_per_token: 524288
      block_size: 16
      gpu_memory_utilization: 0.9
      watermark: 0.01
    scheduler: &scheduler
      max_batch_tokens: 8192
      max_num_sequences: 64
    latency: &latency
      step_overhead_ms: 0
    efficiency: &efficiency
      compute: 1.0
      memory: 1.0

  # E3: a smaller prefill budget, so a full prefill step is 28 ms, not 112 ms.
  - <<: *base
    name: budget-2048
    scheduler:
      <<: *scheduler
      max_batch_tokens: 2048

  # E4, E5: about 20,000 tokens of KV cache (1,260 blocks) instead of 121,744,
  # so a modest load runs out of it. The context length must fit the cache.
  - <<: *base
    name: small-kv
    context_length: 16384
    kv_cache:
      <<: *kv_cache
      gpu_memory_utilization: 0.28

  # E5: the same cache without the admission watermark.
  - <<: *base
    name: small-kv-no-watermark
    context_length: 16384
    kv_cache:
      <<: *kv_cache
      gpu_memory_utilization: 0.28
      watermark: 0

  # E6: 1 ms of CPU-side overhead on every step.
  - <<: *base
    name: overhead-1ms
    latency:
      <<: *latency
      step_overhead_ms: 1

  # E6: kernels reaching 80% of peak memory bandwidth.
  - <<: *base
    name: memory-eff-80
    efficiency:
      <<: *efficiency
      memory: 0.8
