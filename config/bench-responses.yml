# Responses for benchmarking with llmsim-bench. Start the server with
#   LLM_SIM_RESPONSES=config/bench-responses.yml poetry run llmsimulator
# Every response is long synthetic text, so the request's max_tokens sets the
# exact output length, whatever the prompt says. See docs/schema.md.
version: 1
seed: 42

responses:
  # Mixed-length workloads: the prompt's tag picks a length range, and the
  # request hash picks a deterministic length within it.
  - id: bench-short
    match: { regex: '^\[short\]' }
    synthetic: { tokens: [32, 128] }
  - id: bench-long
    match: { regex: '^\[long\]' }
    synthetic: { tokens: [1024, 4096] }

# Untagged prompts: 4096 tokens, cut to exactly max_tokens.
default:
  synthetic: { tokens: [4096, 4096] }
