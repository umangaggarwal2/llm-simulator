      - "Project Gutenberg has tens of thousands of free public-domain ebooks, including nearly everything by Shakespeare, Austen, Dickens and Wilde."
      - "Copyright terms vary by country. In much of the world it lasts for the author's life plus 70 years, so authors who died before the mid-1950s are generally public domain there."
      - "Good news for readers: almost every classic from before the twentieth century, from Paradise Lost to Dracula, is public domain and free to read online."
  - id: author-shakespeare
    match: { contains: ["shakespeare", "the bard"] }
    variants:
      - "William Shakespeare (1564 to 1616) wrote around 39 plays, 154 sonnets and several longer poems. If you're new to him, Macbeth is short and gripping, and A Midsummer Night's Dream is great fun."
      - "Shakespeare's plays are usually grouped into comedies, histories, tragedies and late romances. Hamlet, King Lear, Othello and Macbeth are often called the four great tragedies."
      - "Shakespeare was born in Stratford-upon-Avon, worked in London as an actor, playwright and shareholder in the Globe Theatre, and retired to Stratford, where he died in 1616."
      - "Half of Shakespeare's plays would have been lost without the First Folio, the collected edition his fellow actors published in 1623, seven years after his death."
      - "Shakespeare gave English hundreds of phrases still in use, like 'wild-goose chase', 'break the ice' and 'a sorry sight'. Want to dig into a particular play?"
  - id: author-wilde
    match: { contains: ["wilde", "oscar"] }
    variants:
