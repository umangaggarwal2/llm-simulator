      - "Wilde was the most celebrated playwright in London in early 1895, with two hits running at once. Within months he was convicted of 'gross indecency' and sentenced to two years' hard labour."
      - "Wilde was a leading figure in the Aesthetic Movement, which championed art for art's sake. You can hear that philosophy in the preface to Dorian Gray."
      - "Beyond the plays and Dorian Gray, Wilde wrote lovely fairy tales, like The Happy Prince and The Selfish Giant, and the long prison letter De Profundis."
      - "If you want to start with Wilde, The Importance of Being Earnest is short, hilarious and packed with lines you'll want to quote."
  - id: author-austen
    match: { contains: ["austen"] }
    variants:
      - "Jane Austen (1775 to 1817) published six novels: Sense and Sensibility, Pride and Prejudice, Mansfield Park, Emma, Northanger Abbey and Persuasion."
      - "Austen's novels were all published anonymously during her lifetime. Her name appeared publicly only after her death, in a note her brother Henry added to Persuasion and Northanger Abbey."
      - "Austen is famous for free indirect discourse, slipping into a character's thoughts while keeping the narrator's irony. Emma is a masterclass in it."
      - "If you're new to Austen, Pride and Prejudice is the obvious place to start. If you've read that, try Persuasion for something quieter and deeper."
      - "Austen wrote about a narrow world of country gentry, but her eye for money, marriage and self-deception makes her feel strikingly modern."
  - id: author-dickens
    match: { contains: ["dickens"] }
    variants:
      - "Charles Dickens (1812 to 1870) was the most popular novelist of the Victorian age, known for vivid characters and fierce social criticism."
