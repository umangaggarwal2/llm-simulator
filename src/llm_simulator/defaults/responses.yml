  - id: public-domain
    match: { contains: ["public domain", "copyright", "free to read", "project gutenberg"] }
    variants:
      - "A work enters the public domain when its copyright expires. In the US, books published in 1930 or earlier are now public domain, which covers everything from Shakespeare to The Great Gatsby."
