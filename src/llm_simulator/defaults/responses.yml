      - "As a boy, Dickens worked in a blacking factory while his father was in a debtors' prison, and that experience shaped books like David Copperfield and Little Dorrit."
      - "A good route into Dickens: start with A Christmas Carol, which is short, then try Great Expectations or A Tale of Two Cities."
      - "Dickens gave his characters unforgettable names, like Uriah Heep, Mr Pumblechook, Ebenezer Scrooge and Wackford Squeers."
